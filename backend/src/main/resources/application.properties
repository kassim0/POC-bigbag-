spring.application.name=bingbang
server.port=8080

# RAWG catalogue. The key is never committed: set the RAWG_API_KEY environment variable.
rawg.base-url=https://api.rawg.io/api
rawg.api-key=${RAWG_API_KEY:}

# File-based H2 database so that wallets survive a restart.
spring.datasource.url=jdbc:h2:file:./data/bingbang;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Origin of the Angular dev server.
bingbang.cors.allowed-origins=http://localhost:4200
