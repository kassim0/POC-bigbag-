spring.application.name=bingbang
server.port=8080

# Games catalogue: BingBang searches its own database, filled from IGDB by the import batch (see PROGRESS.md).
# Twitch application credentials, never committed: IGDB_CLIENT_ID / IGDB_CLIENT_SECRET.
bingbang.igdb.client-id=${IGDB_CLIENT_ID:}
bingbang.igdb.client-secret=${IGDB_CLIENT_SECRET:}
# When to run: a Spring cron expression ("-" = never), and/or once at startup.
bingbang.igdb.import.cron=${IGDB_IMPORT_CRON:-}
bingbang.igdb.import.run-on-startup=${IGDB_IMPORT_ON_STARTUP:false}
# Games per request (IGDB's maximum is 500) and pause between requests (IGDB allows 4 requests/second).
bingbang.igdb.import.page-size=500
bingbang.igdb.import.pause-ms=300
# 0 = no limit. Otherwise a run stops after that many pages and the next one carries on.
bingbang.igdb.import.max-pages-per-run=0
# Optional extra IGDB filter to import only part of the database, e.g. total_rating_count > 0
bingbang.igdb.import.where=

# File-based H2 database so that wallets survive a restart.
spring.datasource.url=jdbc:h2:file:./data/bingbang-v2;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Origin of the Angular dev server.
bingbang.cors.allowed-origins=http://localhost:4200
